name: Extension Test
description: Set up Quarto and run the extension test framework over a repository.

inputs:
  quarto:
    description: "Quarto channel: release or pre-release."
    required: false
    default: "release"
  runner:
    description: "Glob that resolves to the runner."
    required: false
    default: "tests/_extensions/*/extension-test/run.lua"
  args:
    description: "Further options passed to the runner."
    required: false
    default: ""
  results:
    description: >-
      Path the runner writes the result JSON to. The upload follows it: the
      logs are read from the `logs` directory beside it, and the rendered
      documents from the `_output` directory beside its parent. Move it out of
      a `_results` directory and those two move with it.
    required: false
    default: "tests/_results/results.json"
  node-version:
    description: "Node.js version to set up for a check command, for example `22`. Empty sets up no Node.js."
    required: false
    default: ""
  playwright-browsers:
    description: "Playwright browsers to install, for example `chromium`. Needs `node-version`."
    required: false
    default: ""

runs:
  using: composite
  steps:
    # The channel and the glob resolve here rather than in the run step, so a
    # bad channel or a repository that holds no runner fails with a sentence
    # instead of a silent fallback or a shell error.
    - name: Check the inputs and resolve the runner
      id: resolve
      shell: bash
      env:
        QUARTO_CHANNEL: ${{ inputs.quarto }}
        RUNNER_GLOB: ${{ inputs.runner }}
        RESULTS: ${{ inputs.results }}
        NODE_VERSION: ${{ inputs.node-version }}
        PLAYWRIGHT_BROWSERS: ${{ inputs.playwright-browsers }}
      run: |
        set -euo pipefail
        case "${QUARTO_CHANNEL}" in
          release | pre-release) ;;
          *)
            printf 'Error: quarto must be release or pre-release, not %s.\n' "${QUARTO_CHANNEL}" >&2
            exit 1
            ;;
        esac
        if [[ -n "${PLAYWRIGHT_BROWSERS}" && -z "${NODE_VERSION}" ]]; then
          printf 'Error: playwright-browsers needs node-version, because Playwright runs on Node.js.\n' >&2
          exit 1
        fi
        mapfile -t runners < <(compgen -G "${RUNNER_GLOB}" || true)
        if [[ "${#runners[@]}" -eq 0 ]]; then
          printf 'Error: no runner matched %s.\n' "${RUNNER_GLOB}" >&2
          exit 1
        fi
        # The runner writes the logs beside the result file and the rendered
        # documents beside the tests directory, so the upload follows the
        # result path rather than a second input that could disagree with it.
        results_dir="$(dirname -- "${RESULTS}")"
        tests_dir="$(dirname -- "${results_dir}")"
        if [[ "$(basename -- "${results_dir}")" != "_results" ]]; then
          printf '::warning::results is %s, which is not inside a _results directory, so the artefact looks for the logs at %s and the rendered documents at %s. Check both.\n' \
            "${RESULTS}" "${results_dir}/logs" "${tests_dir}/_output"
        fi
        {
          printf 'path=%s\n' "${runners[0]}"
          printf 'logs=%s\n' "${results_dir}/logs"
          printf 'output=%s\n' "${tests_dir}/_output"
          printf 'tests=%s\n' "${tests_dir}"
        } >> "${GITHUB_OUTPUT}"

    - name: Setup Quarto
      uses: quarto-dev/quarto-actions/setup@v2
      with:
        version: ${{ inputs.quarto }}

    - name: Setup Node.js
      if: ${{ inputs.node-version != '' }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install the Node.js dependencies
      if: ${{ inputs.node-version != '' }}
      shell: bash
      env:
        TESTS_DIR: ${{ steps.resolve.outputs.tests }}
      run: |
        set -euo pipefail
        if [[ -f "${TESTS_DIR}/package-lock.json" ]]; then
          cd -- "${TESTS_DIR}"
          npm ci
        else
          printf '::warning::node-version is set but %s does not exist, so npm ci did not run and npx resolves packages on its own.\n' \
            "${TESTS_DIR}/package-lock.json"
        fi

    - name: Install the Playwright browsers
      if: ${{ inputs.playwright-browsers != '' }}
      shell: bash
      env:
        TESTS_DIR: ${{ steps.resolve.outputs.tests }}
        PLAYWRIGHT_BROWSERS: ${{ inputs.playwright-browsers }}
      run: |
        set -euo pipefail
        if [[ ! -d "${TESTS_DIR}" ]]; then
          printf 'Error: the tests directory %s, found from results, does not exist, so Playwright has nowhere to install.\n' "${TESTS_DIR}" >&2
          exit 1
        fi
        cd -- "${TESTS_DIR}"
        # Word splitting is deliberate: `playwright-browsers` is a list of names.
        # shellcheck disable=SC2086
        npx playwright install --with-deps ${PLAYWRIGHT_BROWSERS}

    - name: Run the tests
      id: run
      shell: bash
      env:
        RUNNER_PATH: ${{ steps.resolve.outputs.path }}
        RUNNER_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        # Word splitting is deliberate: `args` is a command line, not one path.
        # shellcheck disable=SC2086
        quarto pandoc lua "${RUNNER_PATH}" ${RUNNER_ARGS}

    # Gated like the upload: when the inputs are refused, there is no run to
    # summarise, and a "no result file" line would read as a failed suite.
    - name: Write the summary
      if: ${{ always() && steps.resolve.outputs.path != '' }}
      shell: bash
      env:
        RESULTS: ${{ inputs.results }}
        RUN_OUTCOME: ${{ steps.run.outcome }}
      run: |
        set -euo pipefail
        if [[ ! -f "${RESULTS}" ]]; then
          # A missing file after a failed run is expected, because the harness
          # can stop before it writes one. A missing file after a run that
          # passed means `results` names the wrong path, so it is an error.
          if [[ "${RUN_OUTCOME}" == "success" ]]; then
            printf 'Error: the tests passed but no result file is at %s.\n' "${RESULTS}" >&2
            exit 1
          fi
          printf 'No result file at %s.\n' "${RESULTS}" >> "${GITHUB_STEP_SUMMARY}"
          exit 0
        fi
        # A summary that renders headers only, or a row of nulls, and exits 0
        # hides the very failure this framework exists to report. Presence is
        # not enough: every field the table reads is checked for its type, and
        # the layer list is checked for being non-empty.
        if ! jq -e '
          (.layer_order | type) == "array"
            and (.layer_order | length) > 0
            and (.layers | type) == "object"
            and (.status | type) == "string"
            and (.summary.total | type) == "number"
            and (.summary.fail | type) == "number"
            and (.framework.version | type) == "string"
            and ([.layer_order[] as $name | .layers[$name]
                  | (.total | type) == "number"
                    and (.pass | type) == "number"
                    and (.fail | type) == "number"
                    and (.skip | type) == "number"] | all)
        ' "${RESULTS}" > /dev/null; then
          printf 'Error: %s does not carry the expected result shape.\n' "${RESULTS}" >&2
          exit 1
        fi
        printf '## Extension test\n\n' >> "${GITHUB_STEP_SUMMARY}"
        jq -r '
          "| Layer | Total | Pass | Fail | Skip |",
          "|---|---|---|---|---|",
          (.layer_order[] as $name | .layers[$name] |
            "| \($name) | \(.total) | \(.pass) | \(.fail) | \(.skip) |"),
          "",
          "Overall: \(.status), \(.summary.total) cases, framework \(.framework.version).",
          "",
          (if (.summary.fail // 0) > 0 then
            "### Failures", "",
            (.cases[] | select(.status == "fail") |
              "- `\(.id)`: \(.failure.message // .failure.reason // "no message")")
           else empty end)
        ' "${RESULTS}" >> "${GITHUB_STEP_SUMMARY}"

    - name: Upload the results
      if: ${{ always() && steps.resolve.outputs.path != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: extension-test-${{ inputs.quarto }}
        path: |
          ${{ inputs.results }}
          ${{ steps.resolve.outputs.logs }}/**
          ${{ steps.resolve.outputs.output }}/**
        if-no-files-found: ignore
