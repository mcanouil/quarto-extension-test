name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "_extensions/**"
      - "tests/**"
      - ".github/actions/extension-test/action.yml"
      - ".github/actions/extension-test-q2/action.yml"
      - ".github/workflows/test.yml"
  push:
    branches: [main]
    paths:
      - "_extensions/**"
      - "tests/**"
      - ".github/actions/extension-test/action.yml"
      - ".github/actions/extension-test-q2/action.yml"
      - ".github/workflows/test.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # A draft is skipped, matching the convention across the extension
    # repositories, so a work in progress does not spend runner minutes.
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The guard must fail before Quarto is set up, so this costs seconds.
      - name: Run the action with playwright-browsers and no node-version
        id: browsers-without-node
        continue-on-error: true
        uses: ./.github/actions/extension-test
        with:
          runner: "_extensions/extension-test/run.lua"
          playwright-browsers: "chromium"

      - name: Expect that run to fail
        shell: bash
        env:
          OUTCOME: ${{ steps.browsers-without-node.outcome }}
        run: |
          set -euo pipefail
          if [[ "${OUTCOME}" != "failure" ]]; then
            printf 'Error: the action accepted playwright-browsers without node-version (outcome %s).\n' "${OUTCOME}" >&2
            exit 1
          fi

      # The guard must fail before any install, so this costs seconds.
      - name: Run the action with an apt package name that is an option
        id: apt-option
        continue-on-error: true
        uses: ./.github/actions/extension-test
        with:
          runner: "_extensions/extension-test/run.lua"
          apt-packages: "poppler-utils --allow-unauthenticated"

      - name: Expect that run to fail
        shell: bash
        env:
          OUTCOME: ${{ steps.apt-option.outcome }}
        run: |
          set -euo pipefail
          if [[ "${OUTCOME}" != "failure" ]]; then
            printf 'Error: the action accepted an apt package name that starts with a dash (outcome %s).\n' "${OUTCOME}" >&2
            exit 1
          fi

      - name: Run the action with a Quarto tool name that is an option
        id: tool-option
        continue-on-error: true
        uses: ./.github/actions/extension-test
        with:
          runner: "_extensions/extension-test/run.lua"
          quarto-tools: "verapdf --log-level"

      - name: Expect that run to fail
        shell: bash
        env:
          OUTCOME: ${{ steps.tool-option.outcome }}
        run: |
          set -euo pipefail
          if [[ "${OUTCOME}" != "failure" ]]; then
            printf 'Error: the action accepted a Quarto tool name that starts with a dash (outcome %s).\n' "${OUTCOME}" >&2
            exit 1
          fi

      # The repository is the first consumer of its own action. The action sets
      # up Quarto, which the unit suite also needs, because the fixture tests
      # drive the Quarto CLI and the unit tests call `pandoc.*`.
      #
      # The runner lives at the repository root here rather than under
      # `tests/_extensions`, and the repository is the framework rather than an
      # extension under test, so the action is pointed at one fixture.
      - name: Run the framework over its own fixtures
        uses: ./.github/actions/extension-test
        with:
          runner: "_extensions/extension-test/run.lua"
          args: "--root tests/fixtures/clean --tests tests/fixtures/clean/_t"
          results: "tests/fixtures/clean/_t/_results/results.json"
          apt-packages: "poppler-utils"
          quarto-tools: "verapdf"

      - name: Expect the apt package to be installed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdftotext > /dev/null; then
            printf 'Error: apt-packages named poppler-utils, but pdftotext is not on the PATH.\n' >&2
            exit 1
          fi

      # The guard must fail before Quarto is set up, so this costs seconds.
      - name: Run the q2 action with an unknown channel
        id: q2-bad-channel
        continue-on-error: true
        uses: ./.github/actions/extension-test-q2
        with:
          channel: "beta"
          runner: "_extensions/extension-test/run.lua"

      - name: Expect that run to fail
        shell: bash
        env:
          OUTCOME: ${{ steps.q2-bad-channel.outcome }}
        run: |
          set -euo pipefail
          if [[ "${OUTCOME}" != "failure" ]]; then
            printf 'Error: the q2 action accepted the channel beta (outcome %s).\n' "${OUTCOME}" >&2
            exit 1
          fi

      # The q2 action also leaves q2 and pandoc on PATH, so the unit tests
      # below run the same-verdict test instead of skipping it.
      - name: Run the q2 action over its own fixture
        uses: ./.github/actions/extension-test-q2
        with:
          channel: "release"
          runner: "_extensions/extension-test/run.lua"
          args: "--root tests/fixtures/q2-selection --tests tests/fixtures/q2-selection/_t"

      - name: Run the unit tests
        shell: bash
        run: |
          set -euo pipefail
          quarto pandoc lua tests/run.lua
