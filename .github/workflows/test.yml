name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "_extensions/**"
      - "tests/**"
      - ".github/workflows/test.yml"
  push:
    branches: [main]
    paths:
      - "_extensions/**"
      - "tests/**"
      - ".github/workflows/test.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # A draft is skipped, matching the convention across the extension
    # repositories, so a work in progress does not spend runner minutes.
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The fixture tests drive the Quarto CLI, and the unit tests call
      # `pandoc.*`, so both need Quarto rather than a standalone interpreter.
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Run the tests
        run: quarto pandoc lua tests/run.lua
