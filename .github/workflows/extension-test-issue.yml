name: Extension Test Issue

# Opens or updates one issue naming the cases that failed, for a repository that
# wants a failing scheduled run to leave a trace rather than only a red tick.
#
# Call it as a second job, after the job that calls `extension-test.yml`, and
# grant it `issues: write` there:
#
#   jobs:
#     test:
#       uses: mcanouil/quarto-extension-test/.github/workflows/extension-test.yml@main
#     issue:
#       needs: test
#       if: ${{ failure() }}
#       permissions:
#         contents: read
#         issues: write
#       uses: mcanouil/quarto-extension-test/.github/workflows/extension-test-issue.yml@main
#
# It reads the artefacts the test job uploaded in the same run, so it has to be
# called from that run rather than scheduled on its own.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # One issue for the repository, not one for every run, so a weekly schedule
  # does not open a new issue every week.
  issue:
    name: Report the failure
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # The download fails when the run stopped before it uploaded anything.
      # The issue is still worth opening in that case, so the failure is not
      # allowed to end the job.
      - name: Download the results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: extension-test-*
          path: artefacts

      # The artefact layout depends on which directories the run produced, so
      # the result files are found rather than assumed.
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Extension test failures
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find artefacts -type f -name 'results.json' 2> /dev/null | sort)

          # The artefacts are read to write an accurate opening line, never to
          # decide whether to open the issue at all. The caller's condition is
          # the only thing that knows the run failed: the upload step sets
          # `if-no-files-found: ignore`, so a matrix leg that crashed before
          # writing a result file uploads nothing, and "no failing case in what
          # arrived" would then hide the failure this workflow exists to record.
          #
          # A result file that cannot be read counts as a failure rather than as
          # zero, so a malformed one is reported instead of being counted out.
          failing=0
          unreadable=0
          for file in "${files[@]}"; do
            count="$(jq '[(.cases // [])[] | select(.status == "fail")] | length' "${file}" 2> /dev/null || true)"
            if [[ "${count}" =~ ^[0-9]+$ ]]; then
              failing=$((failing + count))
            else
              unreadable=$((unreadable + 1))
            fi
          done

          body="$(mktemp)"
          {
            if [[ "${failing}" -gt 0 ]]; then
              printf 'The extension test framework reported %d failing case(s).\n\n' "${failing}"
            else
              printf 'The extension test run failed, and no failing case was recorded in the results that reached the artefacts.\n\n'
            fi
            printf 'Run: %s\n' "${RUN_URL}"
          } > "${body}"
          if [[ "${#files[@]}" -eq 0 ]]; then
            printf '\nNo result file reached the artefacts, so the harness stopped before it wrote one.\n' >> "${body}"
          fi
          if [[ "${unreadable}" -gt 0 ]]; then
            printf '\n%d result file(s) could not be read.\n' "${unreadable}" >> "${body}"
          fi
          for file in "${files[@]}"; do
            relative="${file#artefacts/}"
            printf '\n### %s\n\n' "${relative%%/*}" >> "${body}"
            jq -r '
              "Overall: \(.status // "unknown"), \((.summary.total // "unknown" | tostring)) cases, framework \(.framework.version // "unknown").",
              "",
              ((.cases // [])[] | select(.status == "fail") |
                "- `\(.id)`: \(.failure.message // .failure.reason // "no message")")
            ' "${file}" >> "${body}" 2> /dev/null ||
              printf 'This file could not be read.\n' >> "${body}"
          done
          # A title search, not a listing: a listing of the first hundred open
          # issues can miss the one that exists and then open a duplicate.
          number="$(gh issue list --state open --search "in:title \"${TITLE}\"" \
            --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')"
          if [[ -n "${number}" ]]; then
            gh issue comment "${number}" --body-file "${body}"
          else
            gh issue create --title "${TITLE}" --body-file "${body}"
          fi
