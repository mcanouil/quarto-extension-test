name: Extension Test

# A calling repository needs `contents: read` and nothing else.
#
# Reporting a failure as an issue lives in `extension-test-issue.yml`, called as
# a second job by the repositories that want it. It cannot live here: a called
# workflow's job cannot request more than its caller grants, and that is checked
# when the run starts rather than when the job is reached, so a job asking for
# `issues: write` behind an `if` still stops the whole run for every caller that
# does not grant it.
on:
  workflow_call:
    inputs:
      quarto-channels:
        description: "JSON array of Quarto channels."
        required: false
        default: '["release"]'
        type: string
      node-version:
        description: "Node.js version to set up for a check command, for example `22`. Empty sets up no Node.js."
        required: false
        default: ""
        type: string
      playwright-browsers:
        description: "Playwright browsers to install, for example `chromium`. Needs `node-version`."
        required: false
        default: ""
        type: string
      q2-channels:
        description: "JSON array of q2 channels: release, nightly. Empty runs no q2 job."
        required: false
        default: '[]'
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.quarto }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        quarto: ${{ fromJSON(inputs.quarto-channels) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A relative `./` path resolves against the caller's checkout, so the
      # commit of this workflow is checked out beside it. Whatever ref a
      # consumer calls this workflow at, the action comes from the same commit.
      - name: Checkout the extension test actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .extension-test
          persist-credentials: false

      - name: Run the tests
        uses: ./.extension-test/.github/actions/extension-test
        with:
          quarto: ${{ matrix.quarto }}
          node-version: ${{ inputs.node-version }}
          playwright-browsers: ${{ inputs.playwright-browsers }}

  test-q2:
    name: Test on q2 (${{ matrix.channel }})
    # An empty matrix is an error in GitHub Actions, so the job is skipped
    # instead when no q2 channel is asked for.
    if: ${{ inputs.q2-channels != '[]' && inputs.q2-channels != '' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.channel == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(inputs.q2-channels) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Checked out at the commit of this workflow, as in the `test` job.
      - name: Checkout the extension test actions
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .extension-test
          persist-credentials: false

      - name: Run the tests on q2
        uses: ./.extension-test/.github/actions/extension-test-q2
        with:
          channel: ${{ matrix.channel }}
