name: Extension Test

# A calling repository needs `contents: read` and nothing else.
#
# Reporting a failure as an issue lives in `extension-test-issue.yml`, called as
# a second job by the repositories that want it. It cannot live here: a called
# workflow's job cannot request more than its caller grants, and that is checked
# when the run starts rather than when the job is reached, so a job asking for
# `issues: write` behind an `if` still stops the whole run for every caller that
# does not grant it.
on:
  workflow_call:
    inputs:
      quarto-channels:
        description: "JSON array of Quarto channels."
        required: false
        default: '["release"]'
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.quarto }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        quarto: ${{ fromJSON(inputs.quarto-channels) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `@main` is a moving branch, so a consumer that pins this workflow at a
      # tag still gets the action from main. There is no way to avoid that
      # today: a relative `./` path resolves against the calling repository's
      # checkout, and this repository has no release to pin to. The reference
      # moves to a tag at the first release.
      - name: Run the tests
        uses: mcanouil/quarto-extension-test/.github/actions/extension-test@main
        with:
          quarto: ${{ matrix.quarto }}
