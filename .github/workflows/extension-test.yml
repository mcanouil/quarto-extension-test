name: Extension Test

# A calling repository needs `contents: read` for the checkout. It also needs
# `issues: write` when it sets `issue-on-failure`, because the second job opens
# or comments on an issue in the calling repository.
on:
  workflow_call:
    inputs:
      quarto-channels:
        description: "JSON array of Quarto channels."
        required: false
        default: '["release"]'
        type: string
      issue-on-failure:
        description: "Open or update one issue naming the failing cases."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.quarto }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        quarto: ${{ fromJSON(inputs.quarto-channels) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `@main` is a moving branch, so a consumer that pins this workflow at a
      # tag still gets the action from main. There is no way to avoid that
      # today: a relative `./` path resolves against the calling repository's
      # checkout, and this repository has no release to pin to. The reference
      # moves to a tag at the first release.
      - name: Run the tests
        uses: mcanouil/quarto-extension-test/.github/actions/extension-test@main
        with:
          quarto: ${{ matrix.quarto }}

  # One issue for the repository, not one for every run, so a weekly schedule
  # does not open a new issue every week.
  issue:
    name: Report the failure
    needs: test
    if: ${{ failure() && inputs.issue-on-failure }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # The download fails when the run stopped before it uploaded anything.
      # The issue is still worth opening in that case, so the failure is not
      # allowed to end the job.
      - name: Download the results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: extension-test-*
          path: artefacts

      # The artefact layout depends on which directories the run produced, so
      # the result files are found rather than assumed.
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Extension test failures
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          {
            printf 'The extension test framework reported failures.\n\n'
            printf 'Run: %s\n' "${RUN_URL}"
          } > "${body}"
          mapfile -t files < <(find artefacts -type f -name 'results.json' 2> /dev/null | sort)
          if [[ "${#files[@]}" -eq 0 ]]; then
            printf '\nNo result file reached the artefacts, so the harness stopped before it wrote one.\n' >> "${body}"
          fi
          for file in "${files[@]}"; do
            relative="${file#artefacts/}"
            printf '\n### %s\n\n' "${relative%%/*}" >> "${body}"
            jq -r '
              "Overall: \(.status), \(.summary.total) cases, framework \(.framework.version).",
              "",
              (.cases[] | select(.status == "fail") |
                "- `\(.id)`: \(.failure.message // .failure.reason // "no message")")
            ' "${file}" >> "${body}"
          done
          # A title search, not a listing: a listing of the first hundred open
          # issues can miss the one that exists and then open a duplicate.
          number="$(gh issue list --state open --search "in:title \"${TITLE}\"" \
            --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')"
          if [[ -n "${number}" ]]; then
            gh issue comment "${number}" --body-file "${body}"
          else
            gh issue create --title "${TITLE}" --body-file "${body}"
          fi
